<html lang="ko">
<head>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #334155;
      --tag-bg: #312e81;
      --tag-text: #c7d2fe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: 60px;
    }
    .header {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 40px 20px 30px;
      text-align: center;
    }
    .header-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }
    .header p {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 650px;
      margin: 0 auto;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--bg-secondary);
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .stat-pill strong { color: #818cf8; }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .controls {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 1.05rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--text-secondary);
    }
    .tab-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .tab-btn {
      padding: 10px 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-2px);
      background: var(--bg-card-hover);
      border-color: #6366f1;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .card-top {
      margin-bottom: 12px;
    }
    .card-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .card-tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-url {
      font-size: 0.8rem;
      color: var(--text-secondary);
      word-break: break-all;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      color: #818cf8;
      font-weight: 600;
    }
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
    }
    .page-btn {
      padding: 8px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      cursor: pointer;
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-info {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }
  </style>
</head>

    let currentCat = 'all';
    let currentSearch = '';
    let currentPage = 1;
    const PAGE_SIZE = 48;

    const searchInput = document.getElementById('searchInput');
    const tabBar = document.getElementById('tabBar');
    const cardGrid = document.getElementById('cardGrid');
    const resultCount = document.getElementById('resultCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');

    function filterData() {
      const q = currentSearch.toLowerCase().trim();
      return DATA.filter(item => {
        const matchCat = (currentCat === 'all' || item.cat === currentCat);
        if (!matchCat) return false;
        if (!q) return true;
        return item.title.toLowerCase().includes(q) ||
               item.folder.toLowerCase().includes(q) ||
               item.url.toLowerCase().includes(q);
      });
    }

    function render() {
      const filtered = filterData();
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      resultCount.textContent = `총 ${filtered.length.toLocaleString()}개의 리서치 & 콘텐츠 자산이 검색되었습니다.`;

      const start = (currentPage - 1) * PAGE_SIZE;
      const paginated = filtered.slice(start, start + PAGE_SIZE);

      if (paginated.length === 0) {
        cardGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #94a3b8;">일치하는 리서치 자산이 없습니다.</div>';
      } else {
        cardGrid.innerHTML = paginated.map(item => `
          <a class="card" href="${item.url}" target="_blank" rel="noopener noreferrer">
            <div class="card-top">
              <div class="card-badge-row">
                <span class="card-tag">${item.icon} ${item.folder}</span>
              </div>
              <div class="card-title" title="${item.title}">${item.title}</div>
              <div class="card-url">${item.url}</div>
            </div>
            <div class="card-footer">
              <span>바로가기</span>
              <span>↗</span>
            </div>
          </a>
        `).join('');
      }

      pageInfo.textContent = `${currentPage} / ${totalPages} 페이지`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    }

    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      currentPage = 1;
      render();
    });

    tabBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      currentPage = 1;
      render();
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        render();
        window.scrollTo({ top: 300, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      currentPage++;
      render();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    });

    render();
  </script>
