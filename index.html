      } else {
        tab.classList.add('active');
      }
      currentPage = 1;
      render();
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        render();
        window.scrollTo({ top: 300, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      currentPage++;
      render();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    });

    render();
  </script>
</body>
</html>
