<strong>키운 것과 지킨 것 · 라이프人정글</strong>
<p style="margin:4px 0 0">벌을 키우는 일과 공정을 지키는 일은 같은 측정이 아닙니다. 수능 부정행위 제재 강화 발의안을 계기로 정확한 적발과 소명 절차의 중요성을 묻는 편집부 풍자입니다. 최대 10년은 발의안이며 시행 확정이 아닙니다.</p>
<p class="nr-cartoon-fact">2026년 11월 18일 발의된 고등교육법 개정안은 수능 부정행위자의 응시자격 정지를 최대 10년으로 확대하는 내용입니다. 법안 발의와 시행 확정은 다릅니다. 최종 법률·시행 상태를 이 그림으로 안내하지 않습니다.</p>
