</head><body style="max-width:850px;margin:auto;padding:24px;font-family:system-ui;background:#f4f1e9;color:#142027"><a href="../">매거진 홈</a><h1>11/21 · 만평 · 축하 리본보다 무거운 것</h1><img style="width:100%" src="../images/cartoon/nov21-producer-price-new.jpg" alt="축하 리본보다 무거운 것"><p>전월 -0.1%, 안정 축하? / 전년 +7.2% 무게는요?</p><p>작은 한 달의 하락에 축하 리본을 달아도 일 년 전보다 높은 생산자물가의 무게는 남습니다. 대사와 공장 장면은 편집부의 창작 풍자이며 실제 인물·공장을 묘사한 것이 아닙니다.</p><p>한국은행 11월 20일 발표: 2026년 10월 생산자물가지수(잠정), 전월 대비 -0.1%, 전년 동월 대비 +7.2%. 소비자물가나 특정 공산품 가격이 아닙니다.</p><p>정지 이미지 만평입니다.</p><a href="https://www.bok.or.kr/portal/bbs/B0000501/view.do?nttId=11066826&amp;depth=201150&amp;pageUnit=10&amp;pageIndex=1&amp;programType=newsData&amp;menuNo=201264&amp;oldMenuNo=200761">한국은행 원문</a></body></html>
